# PatCode configuration
# provider options: builtin, ollama, openai, anthropic, local
provider: ollama
model: raczek
temperature: 0.7
max_tokens: 4096

# Ollama runs on localhost:11434 by default
# api_key not needed for Ollama
# model_path not needed for Ollama

permissions:
  auto_approve:
    - read
    - glob
    - grep
  # default_deny:
  #   - bash
  #   - write
  #   - edit

theme:
  primary: "#888888"
  secondary: "#aaaaaa"
  success: "#88aa88"
  warning: "#aaaa88"
  error: "#aa8888"

# Session directory
session_dir: ~/.patcode/sessions

# Custom commands (optional)
# commands:
#   - name: "review"
#     prompt: "Review this code for bugs and improvements: {{.file}}"
#     description: "Code review helper"
